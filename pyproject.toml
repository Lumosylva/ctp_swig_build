[project]
name = "ctp-swig"
dynamic = ["version"]
description = "Automatically Compile the CTP C++ Interface into a Python Interface"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Lumosylva", email = "donnymoving@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "hatch>=1.16.5",
    "meson-python>=0.18.0",
    "mypy>=1.18.1",
    "swig>=4.4.1",
    "twine>=6.2.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial :: Investment",
    "Natural Language :: Chinese (Simplified)",
]

keywords = ["ctp", "quantitative", "trading", "swig"]

[project.urls]
Homepage = "https://github.com/ctp-api/ctp-swig-build"
Repository = "https://github.com/ctp-api/ctp-swig-build"
Documentation = "https://github.com/ctp-api/ctp-swig-build/blob/main/README.md"
Issues = "https://github.com/ctp-api/ctp-swig-build/issues"
"Documentation (中文)" = "https://github.com/ctp-api/ctp-swig-build/blob/main/README_CN.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "ctp_api/__version__.py"
pattern = "__version__ = ['\"](?P<version>[^'\"]+)['\"]"

# 平台标签推断
[tool.hatch.build.hooks.custom]
# 指定 hatch_build.py 中定义的钩子类
path = "hatch_build.py"
# 钩子类的名称
class-name = "CustomBuildHook"

[tool.hatch.build.targets.sdist]
include = [
    "ctp_api",
    "build.py",
    "demo",
    "LICENSE",
    "README.md",
    "README_CN.md",
]
# 排除不需要的文件
exclude = [
    "ctp/api/__pycache__",
    "**/*.pyc",
    "/build",
    "/con",
    "**/__pycache__",
    "**/*.pyc",
    ".gitignore",
    ".python-version",
    "uv.lock"
]
# 显式指定要包含的文件模式
artifacts = [
    "ctp_api/*.pyd",
    "ctp_api/*.so",
    "LICENSE",
    "README.md",
    "README_CN.md",
]

[tool.hatch.build.targets.wheel]
packages = [
    "ctp_api",
    "build.py",
    "demo",
    "LICENSE",
    "README.md",
    "README_CN.md",
]
# 排除不需要的文件
exclude = [
    "__pycache__",
    "**/*.pyc",
    "/build",
    "/con",
    "**/__pycache__",
    "**/*.pyc",
    ".gitignore",
    ".python-version",
    "uv.lock"
]
# 显式指定要包含的文件模式
artifacts = [
    "ctp_api/*.pyd",
    "ctp_api/*.so",
    "LICENSE",
    "README.md",
    "README_CN.md",
]
